name: tests

# A clean checkout on every push is what catches the class of defect a local
# working copy hides: a file a test quietly rewrote, a module that only imports
# because something else imported it first, a path that only resolves from one
# directory.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor the README states, and the version the archived run used.
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run the test suite
        run: python -m pytest

      - name: Run each test file in isolation
        # Passing only as part of the whole suite hides order dependence
        # between test files; this is how the shipped lookup tables came to be
        # overwritten without any test failing.
        run: |
          for f in tests/test_*.py; do
            echo "--- $f"
            python -m pytest "$f" -p no:cacheprovider
          done

      - name: Check the frozen run still regenerates
        # The reproducibility claim is that one seeded command reproduces every
        # reported number byte-for-byte. This asserts it rather than trusting it.
        run: |
          python run_analysis.py --seed 20260912 --outdir /tmp/check
          python - <<'PY'
          import json, pathlib, sys

          frozen = pathlib.Path("outputs/frozen")
          fresh = pathlib.Path("/tmp/check")
          drift = []
          for path in sorted(frozen.glob("*.csv")):
              other = fresh / path.name
              if not other.exists():
                  drift.append(f"{path.name}: missing from the fresh run")
              elif path.read_bytes() != other.read_bytes():
                  drift.append(f"{path.name}: differs from the frozen run")

          # The manifest records the time and commit of its own run, so compare
          # the decisions it carries rather than the file.
          a = json.loads((frozen / "manifest.json").read_text())
          b = json.loads((fresh / "manifest.json").read_text())
          for key in ("decisions", "sample_sizes", "parameter_provenance"):
              if a[key] != b[key]:
                  drift.append(f"manifest[{key}] differs from the frozen run")

          if drift:
              sys.exit("frozen outputs did not regenerate:\n  " + "\n  ".join(drift))
          print("every frozen CSV regenerated byte-for-byte")
          PY
