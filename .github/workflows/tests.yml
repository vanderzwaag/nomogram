name: tests

# A clean checkout on every push catches the class of defect a local working
# copy hides: a file a test quietly rewrote, a module that only imports because
# something else imported it first, a path that only resolves from one
# directory.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: suite (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor the README states, and the version the archive was built on.
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install current releases
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run the test suite
        run: python -m pytest

      - name: Run each test file in isolation
        # Passing only as part of the whole suite hides order dependence
        # between test files; this is how the shipped lookup tables came to be
        # overwritten without any test failing.
        run: |
          for f in tests/test_*.py; do
            echo "--- $f"
            python -m pytest "$f" -p no:cacheprovider
          done

      - name: Check the reported numbers are unchanged
        # The claim that has to hold everywhere: every number agrees. Bytes
        # need not, and across machines cannot be expected to.
        run: |
          python run_analysis.py --seed 20260912 --outdir /tmp/check
          python check_frozen.py /tmp/check

  reproduce:
    name: reproduction in the pinned environment
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The interpreter and packages the archive was produced with.
          python-version: "3.11"
          cache: pip

      - name: Install the pinned environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-frozen.txt

      - name: Regenerate the frozen run in the archive's own environment
        # Not --exact. Byte identity is a property of one machine: the last bit
        # of a transcendental function is not specified by IEEE 754, so a
        # different libm moves a result by one ulp and every number downstream
        # follows. The runner is not the machine the archive was built on. What
        # this job adds over the suite job is the environment a reader
        # reproducing the archive will actually install; the step prints the
        # largest difference it found, which should be smaller here.
        run: |
          python run_analysis.py --seed 20260912 --outdir /tmp/check
          python check_frozen.py /tmp/check
